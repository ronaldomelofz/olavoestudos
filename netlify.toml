# Build a partir do GitHub. A pasta base é o site; o filtro tira do dist os vídeos
# removidos do YouTube e o texto integral das aulas (estudo pessoal, só na pasta local).
#
# Credenciais do portal privado (NÃO use prefixo VITE_ — isso embute no JavaScript):
#   ESTUDO_USER, ESTUDO_PASS, ESTUDO_SECRET  no painel do Netlify.
# Livros/COF/Planeta ficam só na máquina local.
[build]
  base = "site"
  command = "npm run build && python ../scripts/filtrar_publico.py"
  publish = "dist"
  functions = "netlify/functions"

[build.environment]
  PYTHON_VERSION = "3.11"

[[redirects]]
  from = "/api/login"
  to = "/.netlify/functions/login"
  status = 200
  force = true

[[redirects]]
  from = "/*"
  to = "/index.html"
  status = 200
